[project]
name = "benford"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jasenovski", email = "igormjsk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.33.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "sqlparse>=0.6.0",
    "tqdm>=4.70.1",
]

[project.scripts]
benford = "benford:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
